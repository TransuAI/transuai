spring.application.name=upload_service
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/upload_db
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:0000}
# MVP 階段先用 Hibernate 自動建表，之後流量/團隊成長再導入 Flyway 做版本化 migration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8082

# gRPC server（服務間溝通改走 gRPC，不再提供業務用 REST API）
spring.grpc.server.port=9090
# 開發階段開放 reflection，方便用 grpcurl 除錯
spring.grpc.server.reflection.enabled=true

# 物件儲存（本機開發打 MinIO，正式環境改指向 Cloudflare R2，改 endpoint/key 即可）
app.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
# presigned URL 簽給瀏覽器用，host 要瀏覽器連得到；沒特別設就沿用 endpoint（docker-compose 模式兩者相同）
app.storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:${app.storage.endpoint}}
app.storage.region=${STORAGE_REGION:us-east-1}
app.storage.access-key=${STORAGE_ACCESS_KEY:admin}
app.storage.secret-key=${STORAGE_SECRET_KEY:00000000}
app.storage.bucket=${STORAGE_BUCKET:media-uploads}
app.storage.path-style-access=${STORAGE_PATH_STYLE_ACCESS:true}
app.storage.presign-expiry-minutes=${STORAGE_PRESIGN_EXPIRY_MINUTES:15}

# RabbitMQ（服務間非同步事件，取代文件裡建議的 Redis Queue，對齊 infra 實際佈署）
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:0000}

app.mq.transcription-requested-queue=transcription.requested