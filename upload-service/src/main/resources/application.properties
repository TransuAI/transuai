spring.application.name=upload_service
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/upload_db
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:0000}
# MVP 階段先用 Hibernate 自動建表，之後流量/團隊成長再導入 Flyway 做版本化 migration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8082

# gRPC server（服務間溝通改走 gRPC，不再提供業務用 REST API）
spring.grpc.server.port=9090
# 開發階段開放 reflection，方便用 grpcurl 除錯
spring.grpc.server.reflection.enabled=true

# 物件儲存（本機開發打 MinIO，正式環境改指向 Cloudflare R2，改 endpoint/key 即可）
app.storage.endpoint=${STORAGE_ENDPOINT:http://localhost:9000}
# presigned URL 簽給瀏覽器用，host 要瀏覽器連得到；沒特別設就沿用 endpoint（docker-compose 模式兩者相同）
app.storage.public-endpoint=${STORAGE_PUBLIC_ENDPOINT:${app.storage.endpoint}}
app.storage.region=${STORAGE_REGION:us-east-1}
app.storage.access-key=${STORAGE_ACCESS_KEY:admin}
app.storage.secret-key=${STORAGE_SECRET_KEY:00000000}
app.storage.bucket=${STORAGE_BUCKET:media-uploads}
app.storage.path-style-access=${STORAGE_PATH_STYLE_ACCESS:true}
app.storage.presign-expiry-minutes=${STORAGE_PRESIGN_EXPIRY_MINUTES:15}
# 播放用的 presigned GET URL 另開一組較長的到期時間（預設 6 小時）：上傳是一次性短暫操作，15 分鐘
# 夠用；播放的錄音/影片可能長達 30 分鐘，使用者中途暫停、離開分頁再回來很正常，見
# docs/adr/0002-presigned-get-url-for-media-playback.md
app.storage.presign-download-expiry-minutes=${STORAGE_PRESIGN_DOWNLOAD_EXPIRY_MINUTES:360}

# 上傳檔案大小限制：max-file-size-bytes 是不分檔案類型的濫用防護上限（預設 1GB，足夠容納一般畫質
# 30 分鐘影片）；max-audio-file-size-bytes 額外只套用在 AUDIO 上傳（預設 20MB，對齊 Groq Whisper
# 免費層的檔案大小上限）——VIDEO 上傳不套用這條，因為原始影片檔案大小跟最終送進 Groq 的音軌大小是
# 兩回事，30 分鐘的時長限制（前端 upload-page.tsx）才是 VIDEO 真正對應 Groq 限制的把關，見
# docs/adr/0001-upload-size-limit-is-file-type-aware.md
app.upload.max-file-size-bytes=${MAX_UPLOAD_FILE_SIZE_BYTES:1073741824}
app.upload.max-audio-file-size-bytes=${MAX_AUDIO_UPLOAD_FILE_SIZE_BYTES:20971520}

# RabbitMQ（服務間非同步事件，取代文件裡建議的 Redis Queue，對齊 infra 實際佈署）
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:0000}
# RabbitTemplate 發送失敗（broker 暫時連不上、DNS 抖動等）時的重試設定，
# 這個服務只有 publish 沒有 consume，所以只需要 template 這邊的重試，不用管 listener retry
spring.rabbitmq.template.retry.enabled=true
spring.rabbitmq.template.retry.initial-interval=1s
spring.rabbitmq.template.retry.multiplier=2
spring.rabbitmq.template.retry.max-interval=30s
spring.rabbitmq.template.retry.max-attempts=5

app.mq.transcription-requested-queue=transcription.requested