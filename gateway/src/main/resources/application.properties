spring.application.name=gateway
# APP_ENV=production 時載入 application-production.properties，並檢查密鑰（config/ProductionSecretsCheck）。
spring.profiles.active=${APP_ENV:development}
server.port=8080

# JWT（驗證前端傳來的 access token）。secret 必須跟 auth-service 的 app.jwt.secret 一致——
# 這裡是本地驗章，不會每個請求都回頭呼叫 auth-service 確認。
# 正式環境務必覆蓋成夠長的隨機值，且要跟 auth-service 同步更新。
app.jwt.secret=${JWT_SECRET:dev-only-shared-secret-change-me-before-any-real-deployment}

# refresh token 放在 httpOnly、SameSite=Strict 的 cookie（見 security/RefreshTokenCookie）。path 是「瀏覽器看到的」換發與登出路徑：
# 前端經 /api 轉到這個 Gateway（Vite 的 proxy、正式環境的反向代理都把 /api 拿掉），所以是 /api/auth；API 不是掛在 /api 底下時要改。
# secure：只在 HTTPS 送；Chrome、Firefox 把 http://localhost 當安全的，本機開發照樣能用（Safari 不行，本機要設 false）。
# 有效時間跟 auth-service 的 refresh token 一樣，讀同一個環境變數。
app.auth.refresh-cookie.path=${REFRESH_COOKIE_PATH:/api/auth}
app.auth.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
app.auth.refresh-cookie.max-age=${JWT_REFRESH_TOKEN_TTL_DAYS:7}d
# 登出、登出所有裝置、改密碼、刪除帳號之後，舊的 access token 記住多久（跟 access token 一樣長，之後自己過期了；見 security/RevokedAccessTokens）。
app.auth.revoked-token-ttl=${JWT_ACCESS_TOKEN_TTL_MINUTES:15}m

# 下游內部服務的 gRPC 位址（都是純內部服務，只有這個 Gateway 直接呼叫）
app.grpc.auth-service-target=${AUTH_SERVICE_GRPC_TARGET:localhost:9091}
app.grpc.upload-service-target=${UPLOAD_SERVICE_GRPC_TARGET:localhost:9090}
app.grpc.transcription-service-target=${TRANSCRIPTION_SERVICE_GRPC_TARGET:localhost:8083}
app.grpc.ai-service-target=${AI_SERVICE_GRPC_TARGET:localhost:8084}

# 已連結的帳號（Google / Notion OAuth）：對方回呼的網址是 {callback-base-url}/oauth/{service}/callback，這個網址要登記在
# Google Cloud 的 OAuth client 裡。本地開發時瀏覽器經過 Vite 的 /api proxy 到 Gateway，所以預設是 5173/api。
# 完成（或失敗）後把使用者轉回 {frontend-url}/settings。
app.oauth.callback-base-url=${OAUTH_CALLBACK_BASE_URL:http://localhost:5173/api}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Redis：限流的計數器（之後也放快取）。連不上時限流放行（見 ratelimit/RateLimiter）。
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}

# cache-aside：Job 的擁有者（見 cache/JobOwnerCache）。擁有者不會變、刪除 Job 時標記刪除；有效時間是保險，也限制刪除時 Redis 剛好連不上的影響。
app.cache.job-owner-ttl=${CACHE_JOB_OWNER_TTL:10m}

# 限流的上限（每條是「一段時間內最多幾次」，見 ratelimit/RateLimitProperties）。
app.rate-limit.login-failures.limit=${RATE_LIMIT_LOGIN_FAILURES:5}
app.rate-limit.login-failures.window=${RATE_LIMIT_LOGIN_FAILURES_WINDOW:15m}
app.rate-limit.login.limit=${RATE_LIMIT_LOGIN:20}
app.rate-limit.login.window=${RATE_LIMIT_LOGIN_WINDOW:15m}
app.rate-limit.register.limit=${RATE_LIMIT_REGISTER:5}
app.rate-limit.register.window=${RATE_LIMIT_REGISTER_WINDOW:1h}
# 所有 API：登入的使用者每人合計、沒登入（或 token 無效）的每個 IP 合計。一個 Job 頁面的輪詢最多約每分鐘 75 個請求，
# 600 讓同時開幾個分頁也碰不到。
app.rate-limit.per-user.limit=${RATE_LIMIT_PER_USER:600}
app.rate-limit.per-user.window=${RATE_LIMIT_PER_USER_WINDOW:1m}
app.rate-limit.per-address.limit=${RATE_LIMIT_PER_ADDRESS:60}
app.rate-limit.per-address.window=${RATE_LIMIT_PER_ADDRESS_WINDOW:1m}
# 花錢的功能（controller 方法上標了 @CostlyFeature("名稱")），每人另外的上限，比上面嚴；每個名稱都要有，漏設就不啟動。
app.rate-limit.costly.upload-url.limit=${RATE_LIMIT_UPLOAD_URL:30}
app.rate-limit.costly.upload-url.window=${RATE_LIMIT_UPLOAD_URL_WINDOW:1h}
app.rate-limit.costly.upload.limit=${RATE_LIMIT_UPLOAD:10}
app.rate-limit.costly.upload.window=${RATE_LIMIT_UPLOAD_WINDOW:1h}
app.rate-limit.costly.question.limit=${RATE_LIMIT_QUESTION:20}
app.rate-limit.costly.question.window=${RATE_LIMIT_QUESTION_WINDOW:1m}
app.rate-limit.costly.quiz.limit=${RATE_LIMIT_QUIZ:10}
app.rate-limit.costly.quiz.window=${RATE_LIMIT_QUIZ_WINDOW:1h}
app.rate-limit.costly.speaker-insights.limit=${RATE_LIMIT_SPEAKER_INSIGHTS:10}
app.rate-limit.costly.speaker-insights.window=${RATE_LIMIT_SPEAKER_INSIGHTS_WINDOW:1h}
app.rate-limit.costly.output.limit=${RATE_LIMIT_OUTPUT:20}
app.rate-limit.costly.output.window=${RATE_LIMIT_OUTPUT_WINDOW:1h}
app.rate-limit.costly.translation.limit=${RATE_LIMIT_TRANSLATION:10}
app.rate-limit.costly.translation.window=${RATE_LIMIT_TRANSLATION_WINDOW:1h}
app.rate-limit.costly.decision-extraction.limit=${RATE_LIMIT_DECISION_EXTRACTION:10}
app.rate-limit.costly.decision-extraction.window=${RATE_LIMIT_DECISION_EXTRACTION_WINDOW:1h}
app.rate-limit.costly.decision-question.limit=${RATE_LIMIT_DECISION_QUESTION:20}
app.rate-limit.costly.decision-question.window=${RATE_LIMIT_DECISION_QUESTION_WINDOW:1m}
app.rate-limit.costly.fact-check.limit=${RATE_LIMIT_FACT_CHECK:10}
app.rate-limit.costly.fact-check.window=${RATE_LIMIT_FACT_CHECK_WINDOW:1h}
app.rate-limit.costly.claim-check.limit=${RATE_LIMIT_CLAIM_CHECK:20}
app.rate-limit.costly.claim-check.window=${RATE_LIMIT_CLAIM_CHECK_WINDOW:1h}
app.rate-limit.costly.regenerate.limit=${RATE_LIMIT_REGENERATE:5}
app.rate-limit.costly.regenerate.window=${RATE_LIMIT_REGENERATE_WINDOW:1h}
app.rate-limit.costly.post-meeting.limit=${RATE_LIMIT_POST_MEETING:10}
app.rate-limit.costly.post-meeting.window=${RATE_LIMIT_POST_MEETING_WINDOW:1h}
app.rate-limit.costly.provider-key.limit=${RATE_LIMIT_PROVIDER_KEY:10}
app.rate-limit.costly.provider-key.window=${RATE_LIMIT_PROVIDER_KEY_WINDOW:1h}
app.rate-limit.costly.transcript-edit.limit=${RATE_LIMIT_TRANSCRIPT_EDIT:300}
app.rate-limit.costly.transcript-edit.window=${RATE_LIMIT_TRANSCRIPT_EDIT_WINDOW:1h}
app.rate-limit.costly.linked-service.limit=${RATE_LIMIT_LINKED_SERVICE:60}
app.rate-limit.costly.linked-service.window=${RATE_LIMIT_LINKED_SERVICE_WINDOW:1h}

# 限流看的是來源 IP。預設 none：就是直接連進來的位址，不看 X-Forwarded-For（使用者可以自己填，信了就能每次換一個假 IP
# 無限猜密碼）。在反向代理後面時設 FORWARD_HEADERS_STRATEGY=native，並把 TRUSTED_PROXIES 設成那個代理位址的正規表示式：
# Tomcat 從 X-Forwarded-For 的右邊往左讀、跳過信任的代理，第一個不是代理的就是來源。沒設 TRUSTED_PROXIES 就一個代理都不信。
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:}

# 每位使用者每月的用量上限（台灣時間的月份，見 usage/UsageLimits）：轉錄分鐘數與平台模型的 token（輸入加輸出）。
app.usage-limits.transcription-minutes=${USAGE_LIMIT_TRANSCRIPTION_MINUTES:600}
app.usage-limits.platform-tokens=${USAGE_LIMIT_PLATFORM_TOKENS:2000000}
# 問答「查網路」每人每月幾次（只算成功的）；Tavily 的免費額度是整個平台每月 1,000 次。
app.usage-limits.web-searches=${USAGE_LIMIT_WEB_SEARCHES:30}
