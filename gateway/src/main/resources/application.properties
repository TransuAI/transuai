spring.application.name=gateway
server.port=8080

# JWT（驗證前端傳來的 access token）。secret 必須跟 auth-service 的 app.jwt.secret 一致——
# 這裡是本地驗章，不會每個請求都回頭呼叫 auth-service 確認。
# 正式環境務必覆蓋成夠長的隨機值，且要跟 auth-service 同步更新。
app.jwt.secret=${JWT_SECRET:dev-only-shared-secret-change-me-before-any-real-deployment}

# 下游內部服務的 gRPC 位址（都是純內部服務，只有這個 Gateway 直接呼叫）
app.grpc.auth-service-target=${AUTH_SERVICE_GRPC_TARGET:localhost:9091}
app.grpc.upload-service-target=${UPLOAD_SERVICE_GRPC_TARGET:localhost:9090}
app.grpc.transcription-service-target=${TRANSCRIPTION_SERVICE_GRPC_TARGET:localhost:8083}
app.grpc.ai-service-target=${AI_SERVICE_GRPC_TARGET:localhost:8084}

# 已連結的帳號（Google / Notion OAuth）：對方回呼的網址是 {callback-base-url}/oauth/{service}/callback，這個網址要登記在
# Google Cloud 的 OAuth client 裡。本地開發時瀏覽器經過 Vite 的 /api proxy 到 Gateway，所以預設是 5173/api。
# 完成（或失敗）後把使用者轉回 {frontend-url}/settings。
app.oauth.callback-base-url=${OAUTH_CALLBACK_BASE_URL:http://localhost:5173/api}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Redis：限流的計數器（之後也放快取）。連不上時限流放行（見 ratelimit/RateLimiter）。
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.timeout=${REDIS_TIMEOUT:500ms}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:500ms}

# 限流的上限（每條是「一段時間內最多幾次」，見 ratelimit/RateLimitProperties）。
app.rate-limit.login-failures.limit=${RATE_LIMIT_LOGIN_FAILURES:5}
app.rate-limit.login-failures.window=${RATE_LIMIT_LOGIN_FAILURES_WINDOW:15m}
app.rate-limit.login.limit=${RATE_LIMIT_LOGIN:20}
app.rate-limit.login.window=${RATE_LIMIT_LOGIN_WINDOW:15m}
app.rate-limit.register.limit=${RATE_LIMIT_REGISTER:5}
app.rate-limit.register.window=${RATE_LIMIT_REGISTER_WINDOW:1h}

# 限流看的是來源 IP。預設 none：就是直接連進來的位址，不看 X-Forwarded-For（使用者可以自己填，信了就能每次換一個假 IP
# 無限猜密碼）。在反向代理後面時設 FORWARD_HEADERS_STRATEGY=native，並把 TRUSTED_PROXIES 設成那個代理位址的正規表示式：
# Tomcat 從 X-Forwarded-For 的右邊往左讀、跳過信任的代理，第一個不是代理的就是來源。沒設 TRUSTED_PROXIES 就一個代理都不信。
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}
server.tomcat.remoteip.internal-proxies=${TRUSTED_PROXIES:}
