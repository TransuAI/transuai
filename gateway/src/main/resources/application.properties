spring.application.name=gateway
server.port=8080

# JWT（驗證前端傳來的 access token）。secret 必須跟 auth-service 的 app.jwt.secret 一致——
# 這裡是本地驗章，不會每個請求都回頭呼叫 auth-service 確認。
# 正式環境務必覆蓋成夠長的隨機值，且要跟 auth-service 同步更新。
app.jwt.secret=${JWT_SECRET:dev-only-shared-secret-change-me-before-any-real-deployment}

# 下游內部服務的 gRPC 位址（都是純內部服務，只有這個 Gateway 直接呼叫）
app.grpc.auth-service-target=${AUTH_SERVICE_GRPC_TARGET:localhost:9091}
app.grpc.upload-service-target=${UPLOAD_SERVICE_GRPC_TARGET:localhost:9090}
app.grpc.transcription-service-target=${TRANSCRIPTION_SERVICE_GRPC_TARGET:localhost:8083}
app.grpc.ai-service-target=${AI_SERVICE_GRPC_TARGET:localhost:8084}
