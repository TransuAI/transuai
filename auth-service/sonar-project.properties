# SonarQube Cloud（見根目錄 README「CI」）：CI 的測試跑完、產生覆蓋率報告之後掃描這個服務。
# organization 與 projectKey 要跟 SonarQube Cloud 上建的專案一樣（monorepo：每個服務一個專案）。
sonar.organization=transuai
sonar.projectKey=TransuAI_transuai-auth-service
sonar.projectName=TransuAI auth-service
sonar.sources=src/main/java
sonar.tests=src/test/java
sonar.java.source=26
sonar.java.binaries=build/classes/java/main
sonar.java.test.binaries=build/classes/java/test
# ./gradlew test 之後的 jacocoTestReport（build.gradle）
sonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml
