spring.application.name=auth_service
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auth_db
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:0000}
# MVP 階段先用 Hibernate 自動建表，之後流量/團隊成長再導入 Flyway 做版本化 migration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8081

# gRPC server（服務間溝通改走 gRPC，不提供業務用 REST API）
spring.grpc.server.port=9091
# 開發階段開放 reflection，方便用 grpcurl 除錯
spring.grpc.server.reflection.enabled=true

# JWT（access/refresh token 簽發）。secret 必須跟 gateway 的 app.jwt.secret 一致——
# gateway 是拿同一把 secret 驗證 access token 簽章，不會另外呼叫這個服務確認。
# 正式環境務必覆蓋成夠長的隨機值，不要沿用預設值。
app.jwt.secret=${JWT_SECRET:dev-only-shared-secret-change-me-before-any-real-deployment}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
app.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:7}
