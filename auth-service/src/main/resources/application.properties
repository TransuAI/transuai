spring.application.name=auth_service
# APP_ENV=production 時載入 application-production.properties，並檢查密鑰（config/ProductionSecretsCheck）。
spring.profiles.active=${APP_ENV:development}
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/auth_db
spring.datasource.username=${DB_USER:admin}
spring.datasource.password=${DB_PASSWORD:0000}
# MVP 階段先用 Hibernate 自動建表，之後流量/團隊成長再導入 Flyway 做版本化 migration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
server.port=8081

# gRPC server（服務間溝通改走 gRPC，不提供業務用 REST API）
spring.grpc.server.port=9091
# 開發階段開放 reflection，方便用 grpcurl 除錯
spring.grpc.server.reflection.enabled=true

# JWT（access/refresh token 簽發）。secret 必須跟 gateway 的 app.jwt.secret 一致——
# gateway 是拿同一把 secret 驗證 access token 簽章，不會另外呼叫這個服務確認。
# 正式環境務必覆蓋成夠長的隨機值，不要沿用預設值。
app.jwt.secret=${JWT_SECRET:dev-only-shared-secret-change-me-before-any-real-deployment}
app.jwt.access-token-ttl-minutes=${JWT_ACCESS_TOKEN_TTL_MINUTES:15}
app.jwt.refresh-token-ttl-days=${JWT_REFRESH_TOKEN_TTL_DAYS:7}
# 已經換發過的 refresh token 在這幾秒內再被用一次不算被盜（前端多個分頁同時換發），見 security/RefreshTokens。
app.jwt.refresh-reuse-grace-seconds=${JWT_REFRESH_REUSE_GRACE_SECONDS:10}
# 一次登入最多維持幾天（一路換發 refresh token 也不會超過），之後要重新登入。
app.jwt.session-max-days=${JWT_SESSION_MAX_DAYS:30}

# RabbitMQ：刪除帳號時發 account.deleted（fanout exchange，經 outbox，見 service/AccountDeletion、event/OutboxPublisher）
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:admin}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:0000}
# publisher confirm 要開（simple），outbox 才知道 broker 真的收到了。
spring.rabbitmq.publisher-confirm-type=simple
app.mq.account-deleted-exchange=account.deleted
app.outbox.poll-interval=1s
app.outbox.confirm-timeout=5s

# 寄信（忘記密碼的連結、密碼改了的通知；見 mail/AccountMail）。SMTP 由部署的單位提供；SMTP_HOST 沒設時忘記密碼不能用、通知不寄。
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
app.mail.from=${MAIL_FROM:}
# 信裡的連結指向前端（跟 gateway 的 FRONTEND_URL 同一個值）。
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# 忘記密碼的重設連結多久內有效。
app.password-reset.ttl=${PASSWORD_RESET_TTL:30m}
