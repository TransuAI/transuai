plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.9.6'
	id 'jacoco'
}

group = 'com.transuai'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

repositories {
	mavenCentral()
}

// 依賴套件弱點掃描（見 README）：Spring Boot 4.1.1 管理的這幾個版本還有已知弱點，先覆蓋成修好的版本；升級 Spring Boot 後
// 它管理的版本追上（或更新）就拿掉對應的那一行。
ext['jackson-2-bom.version'] = '2.21.7'
ext['jackson-bom.version'] = '3.1.7'
ext['tomcat.version'] = '11.0.25'
ext['rabbit-amqp-client.version'] = '5.34.0'

ext {
	jjwtVersion = '0.12.6'
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-amqp'
	implementation 'org.springframework.boot:spring-boot-starter-grpc-server'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
	runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-grpc-server-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
}

tasks.named('test') {
	useJUnitPlatform()
	finalizedBy 'jacocoTestReport'
}

// 測試覆蓋率（CI 交給 SonarQube Cloud，見 sonar-project.properties）。0.8.15 起正式支援 Java 26。
jacoco {
	toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
	reports {
		xml.required = true
	}
}

// SonarQube 分析 Java 時要的相依套件（sonar.java.libraries、sonar.java.test.libraries；沒有的話型別解析不完整）。CI 跑完測試後
// 執行這個 task，把清單交給掃描（.github/workflows/ci.yml）。
tasks.register('sonarLibraries') {
	def mainClasspath = configurations.compileClasspath
	def testClasspath = configurations.testCompileClasspath
	def out = layout.buildDirectory
	outputs.upToDateWhen { false }
	doLast {
		out.file('sonar-libraries.txt').get().asFile.text = mainClasspath.files.findAll { it.name.endsWith('.jar') }.join(',')
		out.file('sonar-test-libraries.txt').get().asFile.text = testClasspath.files.findAll { it.name.endsWith('.jar') }.join(',')
	}
}

// proto 定義集中放在 ../infra/proto（跟 upload-service 一樣），只編這個服務自己的 auth.proto。
sourceSets {
	main {
		proto {
			srcDir '../infra/proto'
			include 'auth.proto'
		}
	}
}

protobuf {
	protoc {
		artifact = 'com.google.protobuf:protoc:4.34.2'
	}
	plugins {
		grpc {
			artifact = 'io.grpc:protoc-gen-grpc-java:1.80.0'
		}
	}
	generateProtoTasks {
		all().configureEach {
			plugins {
				grpc {}
			}
		}
	}
}
