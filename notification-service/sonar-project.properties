# SonarQube Cloud（見根目錄 README「CI」）：CI 的測試跑完、產生覆蓋率報告之後掃描這個服務。
# organization 與 projectKey 要跟 SonarQube Cloud 上建的專案一樣（monorepo：每個服務一個專案）。
sonar.organization=transuai
sonar.projectKey=TransuAI_transuai-notification-service
sonar.projectName=TransuAI notification-service
sonar.sources=app
sonar.tests=tests
# protoc 產生的程式碼（scripts/generate_grpc.sh）不分析
sonar.exclusions=app/proto_gen/**
sonar.python.version=3.12
# pytest --cov=app --cov-report=xml
sonar.python.coverage.reportPaths=coverage.xml
