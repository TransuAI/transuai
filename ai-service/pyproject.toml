[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "cryptography>=43",
    "grpcio>=1.83.0",
    "grpcio-health-checking>=1.83.0",
    "grpcio-reflection>=1.83.0",
    "httpx2>=2.12.0",
    "huggingface-hub>=0.27.0",
    "mcp>=2.2.0",
    "numpy>=1.26.0",
    "openai>=3.19",
    "opencc>=1.4.2",
    "pgvector>=0.5.0",
    "pika>=1.4.4",
    "protobuf>=7.35.1",
    "psycopg2-binary>=2.9.12",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.51",
]

[dependency-groups]
dev = [
    "grpcio-tools>=1.83.0",
    "pytest>=9.1.1",
    "testcontainers[postgres]>=4.15.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.pyright]
# app/proto_gen 是 protoc 自動產生的程式碼（DO NOT EDIT），grpc 的 type stub
# 沒宣告 grpc.experimental 等屬性會在這裡產生假警報，不用檢查、也不該手動修改。
exclude = ["app/proto_gen"]
