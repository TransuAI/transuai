# SonarQube Cloud（見根目錄 README「CI」）：CI 的測試跑完、產生覆蓋率報告之後掃描這個服務。
# organization 與 projectKey 要跟 SonarQube Cloud 上建的專案一樣（monorepo：每個服務一個專案）。
sonar.organization=transuai
sonar.projectKey=TransuAI_transuai-frontend
sonar.projectName=TransuAI frontend
sonar.sources=src
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,src/test/**
# vitest run --coverage（vite.config.ts 的 test.coverage）
sonar.javascript.lcov.reportPaths=coverage/lcov.info
