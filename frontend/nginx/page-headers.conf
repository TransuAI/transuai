# 前端頁面（index.html、JS、CSS、字型）的安全標頭（ASVS 14.4.3–14.4.7）。$page_csp 在 default.conf.template 裡組好。
# add_header 只要 location 裡有一個就不繼承外層的，所以每個 location 都 include 這個檔案。
add_header Content-Security-Policy $page_csp always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# 只在 HTTPS 下有作用（瀏覽器不理 HTTP 回應裡的 HSTS），所以一律加。
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
