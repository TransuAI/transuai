# For the alembic CLI during development (e.g. `uv run alembic revision -m "..."`).
# The service itself runs migrations from app/db/session.py at startup; the database URL
# always comes from app.core.config settings (env vars / .env), not from this file.
[alembic]
script_location = app/db/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
