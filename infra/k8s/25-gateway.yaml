apiVersion: v1
kind: Service
metadata:
  name: gateway
  namespace: transuai
spec:
  type: NodePort
  selector:
    app: gateway
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: transuai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z auth-service 9091; do echo waiting for auth-service; sleep 2; done
              until nc -z upload-service 9090; do echo waiting for upload-service; sleep 2; done
              until nc -z transcription-service 8083; do echo waiting for transcription-service; sleep 2; done
              until nc -z ai-service 8084; do echo waiting for ai-service; sleep 2; done
      containers:
        - name: gateway
          image: transuai/gateway:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          # 經前端的 nginx（26-frontend.yaml）進來的請求，來源 IP 在 X-Forwarded-For：只信 pod 網段（kind 的 10.244.0.0/16）的代理。
          # Tomcat 的 internal-proxies 是正規表示式。經 port-forward 直接打進來的是 127.0.0.1，不受影響。
          env:
            - name: FORWARD_HEADERS_STRATEGY
              value: "native"
            - name: TRUSTED_PROXIES
              value: "10\\.244\\.\\d{1,3}\\.\\d{1,3}"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
