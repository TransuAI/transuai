apiVersion: v1
kind: Service
metadata:
  name: transcription-service
  namespace: transuai
spec:
  selector:
    app: transcription-service
  ports:
    - name: grpc
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: transcription-service
  namespace: transuai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: transcription-service
  template:
    metadata:
      labels:
        app: transcription-service
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
              until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done
              until nc -z minio 9000; do echo waiting for minio; sleep 2; done
              until nc -z upload-service 9090; do echo waiting for upload-service; sleep 2; done
      containers:
        - name: transcription-service
          image: transuai/transcription-service:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: DB_NAME
              value: transcription_db
          readinessProbe:
            tcpSocket:
              port: 8083
            initialDelaySeconds: 10
            periodSeconds: 5
