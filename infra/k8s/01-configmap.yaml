# 各服務共用的非機敏設定，對應每個服務 application.properties / core/config.py 裡
# 同名的環境變數。DB_NAME 因為每個服務不同（auth_db/upload_db/transcription_db/ai_db），
# 留在各自的 Deployment 裡設定，不放這裡。
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: transuai
data:
  # Postgres
  DB_HOST: "postgres"
  DB_PORT: "5432"

  # RabbitMQ
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"

  # 物件儲存（MinIO，正式環境改指向 Cloudflare R2）
  STORAGE_ENDPOINT: "http://minio:9000"
  # presigned URL 簽給瀏覽器用；叢集內的 "minio" 這個 service DNS 瀏覽器解析不到，
  # 要用本機能連到的位址（要搭配 kubectl port-forward svc/minio 9000:9000）
  # localhost:9000 在這台機器上已被別的程序佔用（可能是 docker-compose 模式的 MinIO），
  # 改用 19000 走 kubectl port-forward svc/minio 19000:9000，避免和它衝突/混用資料
  STORAGE_PUBLIC_ENDPOINT: "http://localhost:19000"
  STORAGE_REGION: "us-east-1"
  STORAGE_BUCKET: "media-uploads"
  STORAGE_PATH_STYLE_ACCESS: "true"
  STORAGE_PRESIGN_EXPIRY_MINUTES: "15"
  MINIO_BUCKET: "media-uploads"

  # 服務間 gRPC 位址（k8s Service DNS，同 namespace 內用短名即可解析）
  AUTH_SERVICE_GRPC_TARGET: "auth-service:9091"
  UPLOAD_SERVICE_GRPC_TARGET: "upload-service:9090"
  TRANSCRIPTION_SERVICE_GRPC_TARGET: "transcription-service:8083"
  AI_SERVICE_GRPC_TARGET: "ai-service:8084"

  # RabbitMQ 佇列名稱
  TRANSCRIPTION_REQUESTED_QUEUE: "transcription.requested"
  TRANSCRIPTION_COMPLETED_QUEUE: "transcription.completed"
  AI_COMPLETED_QUEUE: "ai.completed"
  JOB_FAILED_QUEUE: "job.failed"

  # 外部 API 型號（key 本身是機敏資訊，放在 02-secret.yaml）
  # DEEPGRAM_MODEL / DEEPGRAM_LANGUAGE 是 transcription-service 的語音辨識（含講者分離，見
  # transcription-service/docs/adr/0001-deepgram-replaces-groq-for-transcription-and-diarization.md）；
  # AI_HF_CHAT_MODEL 是 ai-service 平台模型的聊天模型（摘要/章節分段/RAG 問答；名稱沿用，跑在哪裡看下面的
  # PLATFORM_LLM_BASE_URL，見 ai-service/docs/adr/0010）
  DEEPGRAM_MODEL: "nova-3"
  DEEPGRAM_LANGUAGE: "zh-TW"
  # 平台模型跑在哪裡：本機開發指向自己電腦上用 Docker 跑的 Ollama（infra/scripts/ollama.sh，用 GPU，不用付 AI API 的錢），
  # pod 經由 Docker Desktop 的 host.docker.internal 連到它。模型名稱是 Ollama 的；Ollama 關 thinking 要帶 reasoning_effort。
  # 切回 HF：PLATFORM_LLM_BASE_URL 設成 https://router.huggingface.co/v1、PLATFORM_LLM_API_KEY 設成空字串（改用
  # HF_API_KEY）、PLATFORM_LLM_EXTRA_BODY 設成 {"chat_template_kwargs": {"enable_thinking": false}}，模型換回
  # Qwen/Qwen3.5-9B 與 Qwen/Qwen3.8-27B:deepinfra（HF 免費帳號每月只有 US$0.10）。
  PLATFORM_LLM_BASE_URL: "http://host.docker.internal:11434/v1"
  PLATFORM_LLM_API_KEY: "ollama"
  PLATFORM_LLM_EXTRA_BODY: '{"reasoning_effort": "none"}'
  AI_HF_CHAT_MODEL: "qwen3.5:9b"
  # 會後處理的平台模型（ai-service/docs/adr/0008）：有設定時，預設模型是平台模型的使用者也能跑會後處理；空字串就是不提供。
  AI_POST_MEETING_PLATFORM_MODEL: "qwen3:14b"
  HF_EMBEDDING_MODEL: "BAAI/bge-m3"

  # 已連結的帳號（Google / Notion OAuth，gateway）：對方回呼 {OAUTH_CALLBACK_BASE_URL}/oauth/{service}/callback，這個網址要
  # 登記在 Google Cloud 的 OAuth client；完成後轉回 {FRONTEND_URL}/settings。前端目前在本機跑 Vite（/api proxy 到 gateway）。
  OAUTH_CALLBACK_BASE_URL: "http://localhost:5173/api"
  FRONTEND_URL: "http://localhost:5173"
