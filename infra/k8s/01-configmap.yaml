# 各服務共用的非機敏設定，對應每個服務 application.properties / core/config.py 裡
# 同名的環境變數。DB_NAME 因為每個服務不同（auth_db/upload_db/transcription_db/ai_db），
# 留在各自的 Deployment 裡設定，不放這裡。
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
  namespace: transuai
data:
  # Postgres
  DB_HOST: "postgres"
  DB_PORT: "5432"

  # RabbitMQ
  RABBITMQ_HOST: "rabbitmq"
  RABBITMQ_PORT: "5672"

  # 物件儲存（MinIO，正式環境改指向 Cloudflare R2）
  STORAGE_ENDPOINT: "http://minio:9000"
  # presigned URL 簽給瀏覽器用；叢集內的 "minio" 這個 service DNS 瀏覽器解析不到，
  # 要用本機能連到的位址（要搭配 kubectl port-forward svc/minio 9000:9000）
  # localhost:9000 在這台機器上已被別的程序佔用（可能是 docker-compose 模式的 MinIO），
  # 改用 19000 走 kubectl port-forward svc/minio 19000:9000，避免和它衝突/混用資料
  STORAGE_PUBLIC_ENDPOINT: "http://localhost:19000"
  STORAGE_REGION: "us-east-1"
  STORAGE_BUCKET: "media-uploads"
  STORAGE_PATH_STYLE_ACCESS: "true"
  STORAGE_PRESIGN_EXPIRY_MINUTES: "15"
  MINIO_BUCKET: "media-uploads"

  # 服務間 gRPC 位址（k8s Service DNS，同 namespace 內用短名即可解析）
  AUTH_SERVICE_GRPC_TARGET: "auth-service:9091"
  UPLOAD_SERVICE_GRPC_TARGET: "upload-service:9090"
  TRANSCRIPTION_SERVICE_GRPC_TARGET: "transcription-service:8083"
  AI_SERVICE_GRPC_TARGET: "ai-service:8084"

  # RabbitMQ 佇列名稱
  TRANSCRIPTION_REQUESTED_QUEUE: "transcription.requested"
  TRANSCRIPTION_COMPLETED_QUEUE: "transcription.completed"
  AI_COMPLETED_QUEUE: "ai.completed"
  JOB_FAILED_QUEUE: "job.failed"

  # 外部 API 型號（key 本身是機敏資訊，放在 02-secret.yaml）
  # GROQ_MODEL 是 transcription-service 的 Whisper 轉錄模型，ai-service 不再呼叫 Groq
  # （摘要/章節分段/RAG 問答都改走 HF Inference Providers，見
  # ai-service/docs/adr/0003-hf-inference-providers-for-generation.md），
  # AI_HF_CHAT_MODEL 是 ai-service 用的聊天模型
  GROQ_MODEL: "whisper-large-v3-turbo"
  AI_HF_CHAT_MODEL: "Qwen/Qwen3.5-9B"
  HF_EMBEDDING_MODEL: "BAAI/bge-m3"
