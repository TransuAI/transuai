apiVersion: v1
kind: Service
metadata:
  name: ai-service
  namespace: transuai
spec:
  selector:
    app: ai-service
  ports:
    - name: grpc
      port: 8084
      targetPort: 8084
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-service
  namespace: transuai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ai-service
  template:
    metadata:
      labels:
        app: ai-service
    spec:
      initContainers:
        - name: wait-for-deps
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done
              until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done
              until nc -z upload-service 9090; do echo waiting for upload-service; sleep 2; done
              until nc -z transcription-service 8083; do echo waiting for transcription-service; sleep 2; done
      containers:
        - name: ai-service
          image: transuai/ai-service:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          env:
            - name: DB_NAME
              value: ai_db
          readinessProbe:
            tcpSocket:
              port: 8084
            initialDelaySeconds: 10
            periodSeconds: 5
