apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: transuai
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: transuai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      initContainers:
        - name: wait-for-rabbitmq
          image: busybox:1.36
          command: ["sh", "-c", "until nc -z rabbitmq 5672; do echo waiting for rabbitmq; sleep 2; done"]
      containers:
        - name: notification-service
          image: transuai/notification-service:dev
          imagePullPolicy: Never
          ports:
            - containerPort: 8085
          # 經前端的 nginx 進來的 WebSocket：只信 pod 網段（kind 的 10.244.0.0/16）帶的 X-Forwarded-For（這裡是 CIDR）。
          env:
            - name: TRUSTED_PROXIES
              value: "10.244.0.0/16"
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: app-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8085
            initialDelaySeconds: 5
            periodSeconds: 5
