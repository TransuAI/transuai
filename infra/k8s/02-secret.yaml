# ⚠️ 只在第一次建叢集時 apply 這個檔。之後用 kubectl patch 補進去的真的金鑰（DEEPGRAM_API_KEY、HF_API_KEY、KEY_ENCRYPTION_KEY、
# GOOGLE_OAUTH_*）在這裡是空的，再 apply 一次會把它們蓋成空字串——KEY_ENCRYPTION_KEY 沒了，已經加密存起來的自有金鑰與
# OAuth 權杖就解不開了。要改這裡的其他值，用 kubectl patch 只改那一個 key。
# 開發用預設值，跟各服務 application.properties / core/config.py 裡寫死的 fallback
# 預設值一致（admin/0000 等），不是新的機敏資訊。
#
# DEEPGRAM_API_KEY / HF_API_KEY 留白，套用後自己補，例如：
#   kubectl -n transuai patch secret app-secrets --type merge -p \
#     "{\"stringData\":{\"DEEPGRAM_API_KEY\":\"$(cut -d= -f2 <<< "$(grep ^DEEPGRAM_API_KEY= ../transcription-service/.env)")\"}}"
#   kubectl -n transuai patch secret app-secrets --type merge -p \
#     "{\"stringData\":{\"HF_API_KEY\":\"$(cut -d= -f2 <<< "$(grep ^HF_API_KEY= ../ai-service/.env)")\"}}"
# 這樣 key 只會在你自己的 shell 裡展開，不會被印出來或進版控。
# KEY_ENCRYPTION_KEY（ai-service 加密使用者自有金鑰的主金鑰）也留白，套用後產生一把補上：
#   kubectl -n transuai patch secret app-secrets --type merge -p \
#     "{\"stringData\":{\"KEY_ENCRYPTION_KEY\":\"$(openssl rand -base64 32)\"}}"
# GOOGLE_OAUTH_CLIENT_ID / GOOGLE_OAUTH_CLIENT_SECRET（ai-service 連結 Google 帳號用）也留白：到 Google Cloud Console
# 建一個「網頁應用程式」OAuth client，已授權的重新導向 URI 填 01-configmap.yaml 的
# OAUTH_CALLBACK_BASE_URL + /oauth/google/callback，再用上面的方式 patch 進來。沒設定時只是不能連結 Google。
# HF_API_KEY 去 huggingface.co/settings/tokens 生一把 fine-grained token（勾選
# "Make calls to Inference Providers"）。
# TAVILY_API_KEY（ai-service 問答「查網路」用，平台付費）也留白：到 tavily.com 申請一把，用上面的方式 patch 進來
#（grep ^TAVILY_API_KEY= ../ai-service/.env）。沒設定時問答不能查網路，前端不顯示開關。
#
# 正式環境（configmap 的 APP_ENV 改成 production）每個服務啟動前都會檢查密鑰：沒設、還是這裡的開發用預設值、或少於 12 字元
#（JWT_SECRET 少於 32）就不啟動，並說出是哪幾個。要換成真的值的：DB_PASSWORD／POSTGRES_PASSWORD、RABBITMQ_PASSWORD、
# STORAGE_SECRET_KEY／MINIO_ROOT_PASSWORD、JWT_SECRET、REDIS_PASSWORD、KEY_ENCRYPTION_KEY、DEEPGRAM_API_KEY（成對的要一樣）。
# 例如 JWT_SECRET 用 `openssl rand -base64 48` 產生。
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: transuai
type: Opaque
stringData:
  DB_USER: "admin"
  DB_PASSWORD: "0000"
  POSTGRES_USER: "admin"
  POSTGRES_PASSWORD: "0000"

  RABBITMQ_USER: "admin"
  RABBITMQ_PASSWORD: "0000"

  STORAGE_ACCESS_KEY: "admin"
  STORAGE_SECRET_KEY: "00000000"
  MINIO_ROOT_USER: "admin"
  MINIO_ROOT_PASSWORD: "00000000"

  JWT_SECRET: "dev-only-shared-secret-change-me-before-any-real-deployment"

  DEEPGRAM_API_KEY: ""
  HF_API_KEY: ""
  KEY_ENCRYPTION_KEY: ""
  # Redis 的密碼：本機開發留空（Redis 不要求密碼）；正式環境必填，Redis 與用它的服務（gateway、transcription-service）都讀這個。
  REDIS_PASSWORD: ""
  GOOGLE_OAUTH_CLIENT_ID: ""
  GOOGLE_OAUTH_CLIENT_SECRET: ""
  TAVILY_API_KEY: ""
