# 開發用預設值，跟各服務 application.properties / core/config.py 裡寫死的 fallback
# 預設值一致（admin/0000 等），不是新的機敏資訊。
#
# GROQ_API_KEY / GEMINI_API_KEY 留白，套用後自己補，例如：
#   kubectl -n transuai patch secret app-secrets --type merge -p \
#     "{\"stringData\":{\"GROQ_API_KEY\":\"$(cut -d= -f2 <<< "$(grep ^GROQ_API_KEY= ../transcription-service/.env)")\"}}"
#   kubectl -n transuai patch secret app-secrets --type merge -p \
#     "{\"stringData\":{\"GEMINI_API_KEY\":\"$(cut -d= -f2 <<< "$(grep ^GEMINI_API_KEY= ../ai-service/.env)")\"}}"
# 這樣 key 只會在你自己的 shell 裡展開，不會被印出來或進版控。
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: transuai
type: Opaque
stringData:
  DB_USER: "admin"
  DB_PASSWORD: "0000"
  POSTGRES_USER: "admin"
  POSTGRES_PASSWORD: "0000"

  RABBITMQ_USER: "admin"
  RABBITMQ_PASSWORD: "0000"

  STORAGE_ACCESS_KEY: "admin"
  STORAGE_SECRET_KEY: "00000000"
  MINIO_ROOT_USER: "admin"
  MINIO_ROOT_PASSWORD: "00000000"

  JWT_SECRET: "dev-only-shared-secret-change-me-before-any-real-deployment"

  GROQ_API_KEY: ""
  GEMINI_API_KEY: ""
