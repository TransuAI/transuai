syntax = "proto3";

package transuai.upload.v1;

option java_multiple_files = true;
option java_package = "com.transuai.upload.grpc.v1";

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// UploadService 是內部服務（僅供 API Gateway / 其他後端服務呼叫）。
// 呼叫端需在 gRPC metadata 帶入 "x-user-id"（由 Gateway 驗證 JWT 後轉發），
// UploadService 不重新驗證 JWT，只信任內部網路呼叫。
service UploadService {
  // 取得物件儲存的 presigned upload URL，此階段尚未建立 Job。
  rpc GetPresignedUploadUrl(GetPresignedUploadUrlRequest) returns (GetPresignedUploadUrlResponse);

  // 前端完成上傳後呼叫，建立 Job record 並發送 transcription.requested 事件。
  rpc CompleteUpload(CompleteUploadRequest) returns (Job);

  // 查詢單一 Job。
  rpc GetJob(GetJobRequest) returns (Job);

  // 取得該 Job 媒體檔案的 presigned download URL，供前端播放器直接讀取；ownership 檢查
  // 方式跟 GetJob 一樣（找不到屬於呼叫端的 Job 就回 NOT_FOUND），不額外驗證。
  rpc GetPresignedDownloadUrl(GetPresignedDownloadUrlRequest) returns (GetPresignedDownloadUrlResponse);

  // 查詢使用者所有 Job（分頁）。
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);

  // 刪除 Job 與相關儲存物件。
  rpc DeleteJob(DeleteJobRequest) returns (google.protobuf.Empty);
}

// InternalJobService 僅供內部服務（Transcription Service / AI Service 等 pipeline 下游）呼叫，
// 用來回寫 Job 狀態。不透過 API Gateway 對外開放，也不需要 "x-user-id"
// （呼叫方只知道 job_id，沒有終端使用者身分），只信任內部網路呼叫。
service InternalJobService {
  // 更新 Job 狀態（例如 transcribing / transcribed / failed），失敗時可附上 error_reason。
  rpc UpdateJobStatus(UpdateJobStatusRequest) returns (Job);
}

enum FileType {
  FILE_TYPE_UNSPECIFIED = 0;
  AUDIO = 1;
  VIDEO = 2;
}

enum JobStatus {
  JOB_STATUS_UNSPECIFIED = 0;
  PENDING = 1;
  UPLOADING = 2;
  UPLOADED = 3;
  TRANSCRIBING = 4;
  TRANSCRIBED = 5;
  SUMMARIZING = 6;
  COMPLETED = 7;
  FAILED = 8;
}

message Job {
  string job_id = 1;
  string user_id = 2;
  string file_name = 3;
  FileType file_type = 4;
  int64 file_size_bytes = 5;
  string storage_path = 6;
  int32 duration_seconds = 7;
  JobStatus status = 8;
  string error_reason = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
}

message GetPresignedUploadUrlRequest {
  string file_name = 1;
  FileType file_type = 2;
  int64 file_size_bytes = 3;
}

message GetPresignedUploadUrlResponse {
  string upload_url = 1;
  string storage_path = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message CompleteUploadRequest {
  string storage_path = 1;
  string file_name = 2;
  FileType file_type = 3;
  int64 file_size_bytes = 4;
  int32 duration_seconds = 5;
}

message GetJobRequest {
  string job_id = 1;
}

message GetPresignedDownloadUrlRequest {
  string job_id = 1;
}

message GetPresignedDownloadUrlResponse {
  string download_url = 1;
  google.protobuf.Timestamp expires_at = 2;
}

message ListJobsRequest {
  int32 page = 1;
  int32 page_size = 2;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  int32 total_count = 2;
  int32 page = 3;
  int32 page_size = 4;
}

message DeleteJobRequest {
  string job_id = 1;
}

message UpdateJobStatusRequest {
  string job_id = 1;
  JobStatus status = 2;
  string error_reason = 3;
}
