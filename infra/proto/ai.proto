syntax = "proto3";

package transuai.ai.v1;

import "google/protobuf/timestamp.proto";

// AiService 是純內部服務，供 Gateway 查詢摘要（對應 ../../architecture-design.md 3.4）。
// MVP 階段做了摘要生成、章節分段、RAG 問答（含對話記憶、streaming），多格式輸出留待後續擴充。
// 主要處理流程是 MQ 驅動（消費 transcription.completed，見 ../../ai-service/README.md），
// 這幾支 RPC 只是查詢用，跟 transcription-service 的 TranscriptionService 是同一種模式。
service AiService {
  // 依 job_id 取得摘要，job_id 不合法回 INVALID_ARGUMENT，找不到回 NOT_FOUND。
  rpc GetSummary(GetSummaryRequest) returns (Summary);

  // 依 job_id 取得章節列表（依 sequence_no 排序），job_id 不合法回 INVALID_ARGUMENT。
  // 找不到對應 job 的章節時回空列表，不算錯誤（章節分段可能還沒跑完或這個 job 沒有章節）。
  rpc ListChapters(ListChaptersRequest) returns (ListChaptersResponse);

  // 針對某個 job 的逐字稿內容做 RAG 問答，server-streaming。job_id/user_id 格式不合法回
  // INVALID_ARGUMENT，這個 job 還沒有 embedding（pipeline 還沒跑完、或該 job 沒有逐字稿分段）回
  // NOT_FOUND。user_id 是 Gateway 已經驗證過 ownership 之後轉過來的，用來記錄 qa_history、決定用誰的預設模型，
  // 不重新驗證。model 不給就用這位使用者的預設模型；給了就只用在這一次提問，必須是他用得到的模型（平台模型、他有
  // 自有金鑰的廠商整理好的清單，或他目前的預設模型），否則在送出任何 chunk 之前回 INVALID_ARGUMENT。
  // 對話記憶的範圍是「這個 job 底下所有問答」，沒有獨立的 conversation/thread 概念
  // （見 ai-service/docs/adr/ 對話範圍的 ADR）；一個 job 的問答串只要 job_id 就能定位。
  //
  // stream 保證的順序：最多一個 sources chunk（在檢索完成、生成答案文字之前送出），接著恰好一個 answered_by
  // chunk（這次用哪個模型回答，只有 provider 與 model），再接著任意數量的 delta chunk（依生成順序），
  // 最後如果中途失敗會有恰好一個 error chunk 並結束 stream（這輪不會有對應的 qa_history 紀錄）；成功的話 stream 在最後一個 delta 後直接結束，不送額外的
  // 「done」訊號——gRPC stream 本身結束就是 done，這輪已經在結束前存進 qa_history。
  rpc AskQuestion(AskQuestionRequest) returns (stream AskQuestionChunk);

  // 依 job_id 取得這個 job 的完整問答紀錄（依 created_at 升冪），job_id 不合法回
  // INVALID_ARGUMENT。沒有問答紀錄回空列表，不算錯誤。不分頁——跟 ListChapters 一樣，MVP
  // 資料量小。user_id 驗證邏輯跟 AskQuestion 一致，Gateway 已經做過 ownership 檢查。
  rpc ListQaHistory(ListQaHistoryRequest) returns (ListQaHistoryResponse);

  // 逐字稿被編輯、摘要與章節過時之後，在背景依最新的逐字稿重新產生兩者（見 transcript-editing spec）。
  // 把狀態設成 RUNNING 並排入 ai-service 自己的 queue 後立即回傳目前的摘要；完成後狀態回到 IDLE、
  // source_revision 更新，失敗則是 FAILED 且舊內容保留。Job 狀態完全不變。已經 RUNNING 且請求在 5 分鐘
  // 內時不重複排入（直接回傳目前狀態）；超過 5 分鐘視為上一次卡住，允許再排一次。這個 job 還沒有摘要
  // 回 NOT_FOUND，job_id 不合法回 INVALID_ARGUMENT，排入 queue 失敗回 UNAVAILABLE（狀態不變）。
  rpc RequestRegeneration(RequestRegenerationRequest) returns (Summary);

  // 一個 Job 的 LLM 用量（見 ai-service/CONTEXT.md「用量」），依時間升冪。job_id 不合法回 INVALID_ARGUMENT；沒有紀錄回空列表。
  // 不驗證使用者，Gateway 已經做過 ownership 檢查。
  rpc ListJobLlmUsage(ListJobLlmUsageRequest) returns (ListJobLlmUsageResponse);

  // 一位使用者在 [start, end) 之間的 LLM 用量，依廠商、模型、金鑰來源彙總（Gateway 把「某個月」換成這段時間）。
  // user_id 不合法、或沒給 start / end 回 INVALID_ARGUMENT；沒有用量回空列表。
  rpc SumUserLlmUsage(SumUserLlmUsageRequest) returns (SumUserLlmUsageResponse);

  // 自有金鑰（見 ai-service/CONTEXT.md）：provider 是 openai / anthropic / gemini / openrouter。user_id 是 Gateway 從 JWT
  // 取得的使用者，不另外驗證。
  //
  // 存入或替換一把自有金鑰：先向廠商驗證（呼叫不收費的查詢 API），通過才加密存下，回傳末四碼。provider 不在清單、金鑰
  // 是空的、或廠商說金鑰無效回 INVALID_ARGUMENT（訊息說明原因）；廠商暫時連不上回 UNAVAILABLE；伺服器沒有設定加密主金鑰
  // 回 FAILED_PRECONDITION。驗證沒通過時什麼都不存。
  rpc SaveProviderKey(SaveProviderKeyRequest) returns (ProviderKey);
  // 刪除一把自有金鑰；沒有這把金鑰時 deleted 是 false，不算錯誤。
  rpc DeleteProviderKey(DeleteProviderKeyRequest) returns (DeleteProviderKeyResponse);
  // 這位使用者存了哪些自有金鑰（只有末四碼，永遠不回傳金鑰本身）。
  rpc ListProviderKeys(ListProviderKeysRequest) returns (ListProviderKeysResponse);

  // 預設模型（見 ai-service/CONTEXT.md）：背景工作（上傳後的摘要與章節、重新產生）與問答都用它。
  //
  // 這位使用者可以選的模型：平台模型，加上他有自有金鑰的每個廠商整理好的模型清單；有 OpenRouter 金鑰時
  // openrouter_custom 為 true，代表可以自己輸入 OpenRouter 模型 ID。
  rpc ListAvailableModels(ListAvailableModelsRequest) returns (ListAvailableModelsResponse);
  // 目前的預設模型；沒有設定過就是平台模型。
  rpc GetDefaultModel(GetDefaultModelRequest) returns (ModelChoice);
  // 設定預設模型：provider 是 "platform" 或有自有金鑰的廠商。整理好的清單裡沒有的模型回 INVALID_ARGUMENT；
  // OpenRouter 的模型 ID 用 OpenRouter 的模型清單確認存在（不存在回 INVALID_ARGUMENT，OpenRouter 連不上回 UNAVAILABLE）；
  // 沒有那個廠商的自有金鑰回 FAILED_PRECONDITION。不會重新產生任何既有的內容。
  rpc SetDefaultModel(SetDefaultModelRequest) returns (ModelChoice);
}

enum RegenerationStatus {
  // 沒有正在進行的重新產生（包含從沒重新產生過）。
  REGENERATION_STATUS_IDLE = 0;
  REGENERATION_STATUS_RUNNING = 1;
  // 上一次重新產生失敗了；摘要與章節仍是舊的。
  REGENERATION_STATUS_FAILED = 2;
}

message RequestRegenerationRequest {
  string job_id = 1;
  // 要求重新產生的使用者（Gateway 驗證過 ownership），用量記在他名下。
  string user_id = 2;
}

message ListJobLlmUsageRequest {
  string job_id = 1;
}

message ListJobLlmUsageResponse {
  repeated LlmUsage records = 1;
}

message SumUserLlmUsageRequest {
  string user_id = 1;
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
}

message SumUserLlmUsageResponse {
  repeated LlmUsageSum sums = 1;
}

// 同一個廠商、模型、金鑰來源的 LLM 用量加總。
message LlmUsageSum {
  string provider = 1;
  string model = 2;
  string key_source = 3;
  // 已知數字的加總；廠商沒回報的不算進去（有幾次見 calls_with_unknown_usage）。
  int64 input_tokens = 4;
  int64 output_tokens = 5;
  // 呼叫次數，失敗的也算。
  int32 calls = 6;
  // 廠商沒有回報 token 數的呼叫次數。
  int32 calls_with_unknown_usage = 7;
}

// 一次 LLM 呼叫的用量。
message LlmUsage {
  // summary / chapters / qa_answer / qa_rewrite / regenerated_summary / regenerated_chapters
  string feature = 1;
  // "platform"（平台模型）或廠商名稱
  string provider = 2;
  string model = 3;
  // "platform"（平台模型）或 "own_key"（自有金鑰）
  string key_source = 4;
  // 廠商沒有回報時不設定（未知），不是 0。
  optional int32 input_tokens = 5;
  optional int32 output_tokens = 6;
  bool succeeded = 7;
  google.protobuf.Timestamp created_at = 8;
}

message Summary {
  string job_id = 1;
  string summary_text = 2;
  // 這份摘要（跟同一次產生的章節）依據的逐字稿 revision；小於逐字稿目前的 revision 就是過時。
  int32 source_revision = 3;
  // RUNNING 超過 5 分鐘視為卡住，回報成 FAILED（可以再要求一次）。
  RegenerationStatus regeneration_status = 4;
  // 產生這份摘要（與同一次產生的章節）的模型；記錄模型之前產生的摘要是空字串。provider 是 "platform" 或廠商名稱。
  string model_provider = 5;
  string model = 6;
}

message GetSummaryRequest {
  string job_id = 1;
}

message Chapter {
  string id = 1;
  string job_id = 2;
  string title = 3;
  double start_time = 4;
  int32 sequence_no = 5;
}

message ListChaptersRequest {
  string job_id = 1;
}

message ListChaptersResponse {
  repeated Chapter chapters = 1;
}

message AskQuestionRequest {
  string job_id = 1;
  string user_id = 2;
  string question = 3;
  // 這一次提問臨時用的模型（只看 provider 與 model）；不給就用預設模型。
  ModelChoice model = 4;
}

message AskQuestionChunk {
  oneof payload {
    // 檢索完成後、生成答案文字之前送出恰好一次。回答依據的逐字稿片段起始時間，
    // 供前端做時間戳跳轉；沒有特定排序保證。
    SourceTimestamps sources = 1;
    // 答案文字的其中一段 token/片段，依生成順序送出，前端接到就直接 append 顯示。
    string delta = 2;
    // 這輪問答中途失敗（改寫、檢索、生成任一步出錯）時送出恰好一次，stream 隨即結束，
    // 這輪不會寫進 qa_history。模型呼叫失敗時訊息會點出是哪個廠商、什麼原因。
    string error = 3;
    // 這次用哪個模型回答（sources 之後、第一個 delta 之前送出恰好一次；只設 provider 與 model）。
    ModelChoice answered_by = 4;
  }
}

message SourceTimestamps {
  repeated double source_timestamps = 1;
}

message ListQaHistoryRequest {
  string job_id = 1;
}

message QaTurn {
  string question = 1;
  string answer = 2;
  // 回答依據的逐字稿片段起始時間，沒有特定排序保證（跟 AskQuestionChunk.sources 同義）。
  repeated double source_timestamps = 3;
  google.protobuf.Timestamp created_at = 4;
  // 回答這一則的模型；記錄模型之前的問答是空字串。provider 是 "platform" 或廠商名稱。
  string model_provider = 5;
  string model = 6;
}

message ListQaHistoryResponse {
  // 依 created_at 升冪排序。
  repeated QaTurn turns = 1;
}

message SaveProviderKeyRequest {
  string user_id = 1;
  string provider = 2;
  string key = 3;
}

message ProviderKey {
  string provider = 1;
  // 金鑰的末四碼，給使用者辨認是哪一把。
  string last4 = 2;
  google.protobuf.Timestamp created_at = 3;
}

message DeleteProviderKeyRequest {
  string user_id = 1;
  string provider = 2;
}

message DeleteProviderKeyResponse {
  bool deleted = 1;
  // 刪掉的金鑰正被預設模型使用時，預設模型改回平台模型，這裡是 true。
  bool default_model_reset = 2;
}

message ListAvailableModelsRequest {
  string user_id = 1;
}

message ListAvailableModelsResponse {
  repeated ModelChoice models = 1;
  bool openrouter_custom = 2;
}

// 一個可以選的模型。provider 是 "platform"（平台模型）或廠商名稱。
message ModelChoice {
  string provider = 1;
  string model = 2;
  // 能不能呼叫工具（會後處理需要）。
  bool supports_tools = 3;
}

message GetDefaultModelRequest {
  string user_id = 1;
}

message SetDefaultModelRequest {
  string user_id = 1;
  string provider = 2;
  string model = 3;
}

message ListProviderKeysRequest {
  string user_id = 1;
}

message ListProviderKeysResponse {
  repeated ProviderKey keys = 1;
}
