syntax = "proto3";

package transuai.ai.v1;

import "google/protobuf/timestamp.proto";

// AiService 是純內部服務，供 Gateway 查詢摘要（對應 ../../architecture-design.md 3.4）。
// MVP 階段做了摘要生成、章節分段、RAG 問答（含對話記憶、streaming），多格式輸出留待後續擴充。
// 主要處理流程是 MQ 驅動（消費 transcription.completed，見 ../../ai-service/README.md），
// 這幾支 RPC 只是查詢用，跟 transcription-service 的 TranscriptionService 是同一種模式。
service AiService {
  // 依 job_id 取得摘要，job_id 不合法回 INVALID_ARGUMENT，找不到回 NOT_FOUND。
  rpc GetSummary(GetSummaryRequest) returns (Summary);

  // 依 job_id 取得章節列表（依 sequence_no 排序），job_id 不合法回 INVALID_ARGUMENT。
  // 找不到對應 job 的章節時回空列表，不算錯誤（章節分段可能還沒跑完或這個 job 沒有章節）。
  rpc ListChapters(ListChaptersRequest) returns (ListChaptersResponse);

  // 針對某個 job 的逐字稿內容做 RAG 問答，server-streaming。job_id/user_id 格式不合法回
  // INVALID_ARGUMENT，這個 job 還沒有 embedding（pipeline 還沒跑完、或該 job 沒有逐字稿分段）回
  // NOT_FOUND。user_id 是 Gateway 已經驗證過 ownership 之後轉過來的，用來記錄 qa_history、決定用誰的預設模型，
  // 不重新驗證。model 不給就用這位使用者的預設模型；給了就只用在這一次提問，必須是他用得到的模型（平台模型、他有
  // 自有金鑰的廠商整理好的清單，或他目前的預設模型），否則在送出任何 chunk 之前回 INVALID_ARGUMENT。
  // 對話記憶的範圍是「這個 job 底下所有問答」，沒有獨立的 conversation/thread 概念
  // （見 ai-service/docs/adr/ 對話範圍的 ADR）；一個 job 的問答串只要 job_id 就能定位。
  //
  // stream 保證的順序：最多一個 sources chunk（在檢索完成、生成答案文字之前送出），接著恰好一個 answered_by
  // chunk（這次用哪個模型回答，只有 provider 與 model），再接著任意數量的 delta chunk（依生成順序），
  // 最後如果中途失敗會有恰好一個 error chunk 並結束 stream（這輪不會有對應的 qa_history 紀錄）；成功的話 stream 在最後一個 delta 後直接結束，不送額外的
  // 「done」訊號——gRPC stream 本身結束就是 done，這輪已經在結束前存進 qa_history。
  rpc AskQuestion(AskQuestionRequest) returns (stream AskQuestionChunk);

  // 依 job_id 取得這個 job 的完整問答紀錄（依 created_at 升冪），job_id 不合法回
  // INVALID_ARGUMENT。沒有問答紀錄回空列表，不算錯誤。不分頁——跟 ListChapters 一樣，MVP
  // 資料量小。user_id 驗證邏輯跟 AskQuestion 一致，Gateway 已經做過 ownership 檢查。
  rpc ListQaHistory(ListQaHistoryRequest) returns (ListQaHistoryResponse);

  // 逐字稿被編輯、摘要與章節過時之後，在背景依最新的逐字稿重新產生兩者（見 transcript-editing spec）。
  // 把狀態設成 RUNNING 並排入 ai-service 自己的 queue 後立即回傳目前的摘要；完成後狀態回到 IDLE、
  // source_revision 更新，失敗則是 FAILED 且舊內容保留。Job 狀態完全不變。已經 RUNNING 且請求在 5 分鐘
  // 內時不重複排入（直接回傳目前狀態）；超過 5 分鐘視為上一次卡住，允許再排一次。這個 job 還沒有摘要
  // 回 NOT_FOUND，job_id 不合法回 INVALID_ARGUMENT，排入 queue 失敗回 UNAVAILABLE（狀態不變）。
  rpc RequestRegeneration(RequestRegenerationRequest) returns (Summary);

  // 一個 Job 的 LLM 用量（見 ai-service/CONTEXT.md「用量」），依時間升冪。job_id 不合法回 INVALID_ARGUMENT；沒有紀錄回空列表。
  // 不驗證使用者，Gateway 已經做過 ownership 檢查。
  rpc ListJobLlmUsage(ListJobLlmUsageRequest) returns (ListJobLlmUsageResponse);

  // 一位使用者在 [start, end) 之間的 LLM 用量，依廠商、模型、金鑰來源彙總（Gateway 把「某個月」換成這段時間）。
  // user_id 不合法、或沒給 start / end 回 INVALID_ARGUMENT；沒有用量回空列表。
  rpc SumUserLlmUsage(SumUserLlmUsageRequest) returns (SumUserLlmUsageResponse);

  // 測驗（見 ai-service/CONTEXT.md「測驗」）。要求產生：建立一份「產生中」的測驗、排入 ai-service 自己的
  // quiz.requested queue，立即回傳（不含題目）。question_count 只能是 5、10、20，否則 INVALID_ARGUMENT；
  // job_id / user_id 不合法也是 INVALID_ARGUMENT；排不進 queue 回 UNAVAILABLE（什麼都沒建立）。
  // user_id 是 Gateway 驗證過 ownership 的使用者，用他的預設模型產生、用量記在他名下。
  rpc RequestQuiz(RequestQuizRequest) returns (Quiz);
  // 一個 Job 的所有測驗（新的在前），不含題目。「產生中」超過 5 分鐘回報成 FAILED。
  rpc ListQuizzes(ListQuizzesRequest) returns (ListQuizzesResponse);
  // 一份測驗，含題目與正確答案（測驗屬於使用者自己，「作答時看不到答案」由前端處理）。
  // 不存在或不屬於這個 job 回 NOT_FOUND。
  rpc GetQuiz(GetQuizRequest) returns (Quiz);
  // 送出一次作答：後端計分並保存，回傳分數與每題結果。answers 依題目順序、每題一個選項位置（從 0 開始），題數
  // 不對或選項超出範圍回 INVALID_ARGUMENT；測驗還沒完成回 FAILED_PRECONDITION；不存在或不屬於這個 job 回 NOT_FOUND。
  // 同一份測驗可以重做，每次作答都保存。
  rpc SubmitQuizAttempt(SubmitQuizAttemptRequest) returns (QuizAttemptResult);

  // 已連結的帳號（見 ai-service/CONTEXT.md）：Google、Notion 各一個，狀態是已連結、已失效或未連結。存取權杖過期時會先
  // 用 refresh token 換新；對方拒絕（授權被撤銷、refresh token 失效）就標成已失效，暫時連不上則維持原狀。
  // 權杖加密存在 ai-service，永遠不會出現在任何回應裡。
  rpc ListConnections(ListConnectionsRequest) returns (ListConnectionsResponse);
  // 開始連結：記下這次授權（state；Notion 另外用 PKCE，第一次會先向 Notion 動態註冊 client），回傳要把使用者轉過去的
  // 授權網址。redirect_uri 是 Gateway 的回呼網址，完成時用同一個。service 不認得回 INVALID_ARGUMENT；伺服器沒設定
  // Google OAuth client 或加密主金鑰回 FAILED_PRECONDITION；連不上 Notion 註冊 client 回 UNAVAILABLE。
  rpc StartConnection(StartConnectionRequest) returns (StartConnectionResponse);
  // 完成連結（Gateway 的回呼）：用 state 找回開始連結的使用者，拿 code 換權杖並加密保存。state 不認得、過期、用過，
  // 或 browser_binding 對不上回 INVALID_ARGUMENT；使用者在對方那邊拒絕（error 有值）或換權杖失敗回 FAILED_PRECONDITION。state 一律只能用一次。
  rpc CompleteConnection(CompleteConnectionRequest) returns (CompleteConnectionResponse);
  // 中斷連結：向對方撤銷授權並刪除權杖。撤銷失敗（例如連不上）時權杖仍然刪除，revoked 是 false；對方說權杖本來就已經
  // 無效（授權早就不在了）算撤銷成功。
  rpc DeleteConnection(DeleteConnectionRequest) returns (DeleteConnectionResponse);

  // 會後處理（見 ai-service/CONTEXT.md）：這個 Job 能不能跑（不能的話附原因）與最新一份紀錄（狀態、進度文字、行動提案）。
  // 「執行中」超過 5 分鐘回報成 FAILED。
  rpc GetPostMeeting(GetPostMeetingRequest) returns (PostMeeting);
  // 開始會後處理：建立一份「執行中」的紀錄、排入 ai-service 自己的 post_meeting.requested queue，立即回傳。
  // 不能跑（預設模型是平台模型或不支援工具呼叫、沒有可用的已連結帳號）回 FAILED_PRECONDITION 並附原因；
  // 已經有一份在跑（沒有卡住）就回傳那一份，不重複排入；timezone 不是 IANA 時區回 INVALID_ARGUMENT；排不進 queue 回 UNAVAILABLE。
  rpc RequestPostMeeting(RequestPostMeetingRequest) returns (PostMeeting);
  // 執行使用者勾選的行動提案（arguments_json 是使用者確認、可能改過的最終參數），逐項呼叫對應的外部服務，每項記錄成功（附
  // 連結）或失敗（附原因）；沒勾選的不動，已經建立過的不再執行。參數不對或對方拒絕只讓那一項失敗。紀錄不屬於這個 job 回
  // NOT_FOUND；還在跑回 FAILED_PRECONDITION；提案不屬於這份紀錄回 INVALID_ARGUMENT。
  rpc ExecuteProposals(ExecuteProposalsRequest) returns (PostMeetingRun);
  // 用上一次的最終參數重試一個失敗的提案；只有失敗的能重試（其他回 FAILED_PRECONDITION）。
  rpc RetryProposal(RetryProposalRequest) returns (PostMeetingRun);
  // 會後處理的設定：Notion 的會議紀錄父頁面與待辦資料庫（沒指定的不設定）。
  rpc GetPostMeetingSettings(GetPostMeetingSettingsRequest) returns (PostMeetingSettings);
  // 儲存設定（整份換掉）：網址是空字串就是不指定。改過的位置會先用 Notion 確認存在、讀得到而且種類對（會議紀錄是頁面、待辦是
  // 資料庫），沒改的沿用；沒連結 Notion 回 FAILED_PRECONDITION，找不到、沒有權限或種類不對回 INVALID_ARGUMENT（附原因），連不上
  // Notion 回 UNAVAILABLE。
  rpc UpdatePostMeetingSettings(UpdatePostMeetingSettingsRequest) returns (PostMeetingSettings);

  // 自有金鑰（見 ai-service/CONTEXT.md）：provider 是 openai / anthropic / gemini / openrouter。user_id 是 Gateway 從 JWT
  // 取得的使用者，不另外驗證。
  //
  // 存入或替換一把自有金鑰：先向廠商驗證（呼叫不收費的查詢 API），通過才加密存下，回傳末四碼。provider 不在清單、金鑰
  // 是空的、或廠商說金鑰無效回 INVALID_ARGUMENT（訊息說明原因）；廠商暫時連不上回 UNAVAILABLE；伺服器沒有設定加密主金鑰
  // 回 FAILED_PRECONDITION。驗證沒通過時什麼都不存。
  rpc SaveProviderKey(SaveProviderKeyRequest) returns (ProviderKey);
  // 刪除一把自有金鑰；沒有這把金鑰時 deleted 是 false，不算錯誤。
  rpc DeleteProviderKey(DeleteProviderKeyRequest) returns (DeleteProviderKeyResponse);
  // 這位使用者存了哪些自有金鑰（只有末四碼，永遠不回傳金鑰本身）。
  rpc ListProviderKeys(ListProviderKeysRequest) returns (ListProviderKeysResponse);

  // 預設模型（見 ai-service/CONTEXT.md）：背景工作（上傳後的摘要與章節、重新產生）與問答都用它。
  //
  // 這位使用者可以選的模型：平台模型，加上他有自有金鑰的每個廠商整理好的模型清單；有 OpenRouter 金鑰時
  // openrouter_custom 為 true，代表可以自己輸入 OpenRouter 模型 ID。
  rpc ListAvailableModels(ListAvailableModelsRequest) returns (ListAvailableModelsResponse);
  // 目前的預設模型；沒有設定過就是平台模型。
  rpc GetDefaultModel(GetDefaultModelRequest) returns (ModelChoice);
  // 設定預設模型：provider 是 "platform" 或有自有金鑰的廠商。整理好的清單裡沒有的模型回 INVALID_ARGUMENT；
  // OpenRouter 的模型 ID 用 OpenRouter 的模型清單確認存在（不存在回 INVALID_ARGUMENT，OpenRouter 連不上回 UNAVAILABLE）；
  // 沒有那個廠商的自有金鑰回 FAILED_PRECONDITION。不會重新產生任何既有的內容。
  rpc SetDefaultModel(SetDefaultModelRequest) returns (ModelChoice);
}

enum RegenerationStatus {
  // 沒有正在進行的重新產生（包含從沒重新產生過）。
  REGENERATION_STATUS_IDLE = 0;
  REGENERATION_STATUS_RUNNING = 1;
  // 上一次重新產生失敗了；摘要與章節仍是舊的。
  REGENERATION_STATUS_FAILED = 2;
}

enum QuizStatus {
  QUIZ_STATUS_UNSPECIFIED = 0;
  QUIZ_STATUS_GENERATING = 1;
  QUIZ_STATUS_COMPLETED = 2;
  // 失敗原因見 failure_reason；使用者可以再產生一份。
  QUIZ_STATUS_FAILED = 3;
}

message RequestQuizRequest {
  string job_id = 1;
  string user_id = 2;
  int32 question_count = 3;
}

message ListQuizzesRequest {
  string job_id = 1;
}

message ListQuizzesResponse {
  repeated Quiz quizzes = 1;
}

message GetQuizRequest {
  string job_id = 1;
  string quiz_id = 2;
}

message Quiz {
  string id = 1;
  string job_id = 2;
  int32 question_count = 3;
  QuizStatus status = 4;
  // FAILED 時給使用者看的原因（例如模型回傳的格式不對、自有金鑰無效）；其他狀態是空字串。
  string failure_reason = 5;
  // 依據的逐字稿 revision 與產生的模型；完成之前是 0 / 空字串。
  int32 source_revision = 6;
  string model_provider = 7;
  string model = 8;
  google.protobuf.Timestamp requested_at = 9;
  // 完成時間；還沒完成（或失敗）時不設定。
  google.protobuf.Timestamp completed_at = 10;
  // 只有 GetQuiz 帶題目，依順序排列。
  repeated QuizQuestion questions = 11;
  // 所有作答裡答對最多的題數；還沒作答過不設定。
  optional int32 best_correct_count = 12;
}

enum ConnectionStatus {
  CONNECTION_STATUS_UNSPECIFIED = 0;
  CONNECTION_STATUS_NOT_CONNECTED = 1;
  CONNECTION_STATUS_CONNECTED = 2;
  // 授權過期又換不到新的，或被使用者在對方那邊撤銷：要重新連結。
  CONNECTION_STATUS_INVALID = 3;
}

message ListConnectionsRequest {
  string user_id = 1;
}

message ListConnectionsResponse {
  // 每個支援的服務一筆（google、notion），包含未連結的。
  repeated Connection connections = 1;
}

message Connection {
  // "google" 或 "notion"
  string service = 1;
  ConnectionStatus status = 2;
  // 連結的時間；未連結時不設定。
  google.protobuf.Timestamp connected_at = 3;
}

message StartConnectionRequest {
  string user_id = 1;
  string service = 2;
  string redirect_uri = 3;
  // Gateway 放進瀏覽器 cookie 的隨機值：只存它的雜湊，回呼時要帶同一個值，這次授權才算數——state 綁定開始連結的那個瀏覽器，
  // 別人拿到授權網址誘騙使用者同意，也連不到自己的帳號上。不能是空的（否則 INVALID_ARGUMENT）。
  string browser_binding = 4;
}

message StartConnectionResponse {
  string authorize_url = 1;
}

message CompleteConnectionRequest {
  string service = 1;
  string state = 2;
  string code = 3;
  // 對方回呼帶的 error（例如使用者按了拒絕的 access_denied）；沒有就是空字串。
  string error = 4;
  // 回呼時瀏覽器帶回來的 cookie 值（見 StartConnectionRequest.browser_binding）；對不上就 INVALID_ARGUMENT。
  string browser_binding = 5;
}

message CompleteConnectionResponse {
  string user_id = 1;
}

message DeleteConnectionRequest {
  string user_id = 1;
  string service = 2;
}

message DeleteConnectionResponse {
  bool revoked = 1;
}

message GetPostMeetingRequest {
  string job_id = 1;
  string user_id = 2;
}

message RequestPostMeetingRequest {
  string job_id = 1;
  string user_id = 2;
  // 瀏覽器的 IANA 時區（例如 Asia/Taipei），換算相對日期用。
  string timezone = 3;
  // Job 的上傳時間（Gateway 查 Job 時一起拿到），換算「明天」「下週三」用。
  google.protobuf.Timestamp uploaded_at = 4;
}

message PostMeeting {
  // 這位使用者現在能不能對這個 Job 跑會後處理；不能的話 unavailable_reason 是給使用者看的原因。
  bool available = 1;
  string unavailable_reason = 2;
  // 最新一份紀錄；還沒跑過就不設定。
  PostMeetingRun latest_run = 3;
  // 給使用者的提示（能跑，但有些事做不到），例如 Notion 已連結但還沒指定會議紀錄頁面，或待辦要建在 Google Tasks 但還沒連結 Google。
  repeated string hints = 4;
  // 這個 Job 之前的紀錄（不含 latest_run），新的在前：提案、勾選執行了哪些（沒執行的仍是 PROPOSED）、結果與連結。
  repeated PostMeetingRun earlier_runs = 5;
}

message GetPostMeetingSettingsRequest {
  string user_id = 1;
}

message UpdatePostMeetingSettingsRequest {
  string user_id = 1;
  // Notion 頁面的網址（或 ID）；空字串是不指定。
  string notion_meetings_page_url = 2;
  // Notion 資料庫的網址（或 ID）；空字串是不指定。
  string notion_todo_database_url = 3;
  // 待辦要建在哪裡；UNSPECIFIED 是維持原本的設定。
  TodoDestination todo_destination = 4;
}

message PostMeetingSettings {
  // 會議紀錄放在這個 Notion 頁面底下；沒指定就不設定。
  NotionLocation notion_meetings_page = 1;
  // 待辦寫進這個 Notion 資料庫；沒指定就不設定。
  NotionLocation notion_todo_database = 2;
  // 待辦要建在哪裡（還沒選過是 Google Tasks）；會後處理只提供這個去處的建立待辦工具。
  TodoDestination todo_destination = 3;
}

enum TodoDestination {
  TODO_DESTINATION_UNSPECIFIED = 0;
  TODO_DESTINATION_GOOGLE_TASKS = 1;
  // 寫進 notion_todo_database；沒指定資料庫就不提待辦。
  TODO_DESTINATION_NOTION = 2;
}

message NotionLocation {
  // 頁面 ID，或資料庫的 data source ID（collection://…）。
  string id = 1;
  string title = 2;
  string url = 3;
}

enum PostMeetingStatus {
  POST_MEETING_STATUS_UNSPECIFIED = 0;
  POST_MEETING_STATUS_RUNNING = 1;
  POST_MEETING_STATUS_COMPLETED = 2;
  // 到了工具呼叫次數或時間的上限而停下；已經產生的提案保留。
  POST_MEETING_STATUS_LIMIT_REACHED = 3;
  POST_MEETING_STATUS_FAILED = 4;
}

message PostMeetingRun {
  string id = 1;
  PostMeetingStatus status = 2;
  // 目前在做什麼（例如「正在查詢你的行事曆…」）。
  string progress = 3;
  // FAILED 時給使用者看的原因。
  string failure_reason = 4;
  // 用哪個模型跑的。
  string model_provider = 5;
  string model = 6;
  google.protobuf.Timestamp requested_at = 7;
  // 結束的時間；還在跑就不設定。
  google.protobuf.Timestamp finished_at = 8;
  // 依產生的順序。
  repeated ActionProposal proposals = 9;
}

message ExecuteProposalsRequest {
  string job_id = 1;
  string user_id = 2;
  string run_id = 3;
  repeated ProposalToExecute proposals = 4;
}

message ProposalToExecute {
  string proposal_id = 1;
  // 使用者確認的最終參數（JSON 物件）。
  string arguments_json = 2;
}

message RetryProposalRequest {
  string job_id = 1;
  string user_id = 2;
  string run_id = 3;
  string proposal_id = 4;
}

enum ProposalStatus {
  PROPOSAL_STATUS_UNSPECIFIED = 0;
  // 還沒執行（等使用者確認）。
  PROPOSAL_STATUS_PROPOSED = 1;
  PROPOSAL_STATUS_DONE = 2;
  PROPOSAL_STATUS_FAILED = 3;
}

// 行動提案（見 ai-service/CONTEXT.md）：agent 想做的一個寫入動作，等使用者確認才執行。
message ActionProposal {
  string id = 1;
  // 哪個外部服務，例如 "google_calendar"。
  string service = 2;
  // 哪一種提案，決定前端用哪種表單，例如 "calendar_event"（arguments：summary、start、end、description）。
  string kind = 3;
  // 要送出的參數，JSON 物件。
  string arguments_json = 4;
  // 確認後要呼叫的工具，例如 "calendar_create_event"。
  string tool = 5;
  ProposalStatus status = 6;
  // 執行成功時，建立好的項目的連結（例如 Google 日曆活動的網址）。
  string result_url = 7;
  // 執行失敗時給使用者看的原因。
  string failure_reason = 8;
  // 還沒執行，而且跟這個 Job 其他次會後處理已經建立過的事項相同（服務、種類、正規化後的標題與時間一樣）：前端標示「上次已建立」、
  // 預設不勾選。
  bool previously_created = 9;
}

message SubmitQuizAttemptRequest {
  string job_id = 1;
  string quiz_id = 2;
  string user_id = 3;
  repeated int32 answers = 4;
}

message QuizAttemptResult {
  int32 correct_count = 1;
  int32 question_count = 2;
  // 依題目順序。
  repeated QuizQuestionResult results = 3;
}

message QuizQuestionResult {
  int32 chosen_option = 1;
  int32 correct_option = 2;
  bool correct = 3;
  string explanation = 4;
}

message QuizQuestion {
  // "multiple_choice"（4 個選項）或 "true_false"（選項固定是「是」「否」）。
  string kind = 1;
  string prompt = 2;
  repeated string options = 3;
  // 正確選項在 options 裡的位置（從 0 開始）。
  int32 correct_option = 4;
  string explanation = 5;
  // 依據的片段開始時間（秒），可能沒有。
  repeated double source_timestamps = 6;
}

message RequestRegenerationRequest {
  string job_id = 1;
  // 要求重新產生的使用者（Gateway 驗證過 ownership），用量記在他名下。
  string user_id = 2;
}

message ListJobLlmUsageRequest {
  string job_id = 1;
}

message ListJobLlmUsageResponse {
  repeated LlmUsage records = 1;
}

message SumUserLlmUsageRequest {
  string user_id = 1;
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
}

message SumUserLlmUsageResponse {
  repeated LlmUsageSum sums = 1;
}

// 同一個廠商、模型、金鑰來源的 LLM 用量加總。
message LlmUsageSum {
  string provider = 1;
  string model = 2;
  string key_source = 3;
  // 已知數字的加總；廠商沒回報的不算進去（有幾次見 calls_with_unknown_usage）。
  int64 input_tokens = 4;
  int64 output_tokens = 5;
  // 呼叫次數，失敗的也算。
  int32 calls = 6;
  // 廠商沒有回報 token 數的呼叫次數。
  int32 calls_with_unknown_usage = 7;
}

// 一次 LLM 呼叫的用量。
message LlmUsage {
  // summary / chapters / qa_answer / qa_rewrite / regenerated_summary / regenerated_chapters / quiz / post_meeting
  string feature = 1;
  // "platform"（平台模型）或廠商名稱
  string provider = 2;
  string model = 3;
  // "platform"（平台模型）或 "own_key"（自有金鑰）
  string key_source = 4;
  // 廠商沒有回報時不設定（未知），不是 0。
  optional int32 input_tokens = 5;
  optional int32 output_tokens = 6;
  bool succeeded = 7;
  google.protobuf.Timestamp created_at = 8;
}

message Summary {
  string job_id = 1;
  string summary_text = 2;
  // 這份摘要（跟同一次產生的章節）依據的逐字稿 revision；小於逐字稿目前的 revision 就是過時。
  int32 source_revision = 3;
  // RUNNING 超過 5 分鐘視為卡住，回報成 FAILED（可以再要求一次）。
  RegenerationStatus regeneration_status = 4;
  // 產生這份摘要（與同一次產生的章節）的模型；記錄模型之前產生的摘要是空字串。provider 是 "platform" 或廠商名稱。
  string model_provider = 5;
  string model = 6;
}

message GetSummaryRequest {
  string job_id = 1;
}

message Chapter {
  string id = 1;
  string job_id = 2;
  string title = 3;
  double start_time = 4;
  int32 sequence_no = 5;
}

message ListChaptersRequest {
  string job_id = 1;
}

message ListChaptersResponse {
  repeated Chapter chapters = 1;
}

message AskQuestionRequest {
  string job_id = 1;
  string user_id = 2;
  string question = 3;
  // 這一次提問臨時用的模型（只看 provider 與 model）；不給就用預設模型。
  ModelChoice model = 4;
}

message AskQuestionChunk {
  oneof payload {
    // 檢索完成後、生成答案文字之前送出恰好一次。回答依據的逐字稿片段起始時間，
    // 供前端做時間戳跳轉；沒有特定排序保證。
    SourceTimestamps sources = 1;
    // 答案文字的其中一段 token/片段，依生成順序送出，前端接到就直接 append 顯示。
    string delta = 2;
    // 這輪問答中途失敗（改寫、檢索、生成任一步出錯）時送出恰好一次，stream 隨即結束，
    // 這輪不會寫進 qa_history。模型呼叫失敗時訊息會點出是哪個廠商、什麼原因。
    string error = 3;
    // 這次用哪個模型回答（sources 之後、第一個 delta 之前送出恰好一次；只設 provider 與 model）。
    ModelChoice answered_by = 4;
  }
}

message SourceTimestamps {
  repeated double source_timestamps = 1;
}

message ListQaHistoryRequest {
  string job_id = 1;
}

message QaTurn {
  string question = 1;
  string answer = 2;
  // 回答依據的逐字稿片段起始時間，沒有特定排序保證（跟 AskQuestionChunk.sources 同義）。
  repeated double source_timestamps = 3;
  google.protobuf.Timestamp created_at = 4;
  // 回答這一則的模型；記錄模型之前的問答是空字串。provider 是 "platform" 或廠商名稱。
  string model_provider = 5;
  string model = 6;
}

message ListQaHistoryResponse {
  // 依 created_at 升冪排序。
  repeated QaTurn turns = 1;
}

message SaveProviderKeyRequest {
  string user_id = 1;
  string provider = 2;
  string key = 3;
}

message ProviderKey {
  string provider = 1;
  // 金鑰的末四碼，給使用者辨認是哪一把。
  string last4 = 2;
  google.protobuf.Timestamp created_at = 3;
}

message DeleteProviderKeyRequest {
  string user_id = 1;
  string provider = 2;
}

message DeleteProviderKeyResponse {
  bool deleted = 1;
  // 刪掉的金鑰正被預設模型使用時，預設模型改回平台模型，這裡是 true。
  bool default_model_reset = 2;
}

message ListAvailableModelsRequest {
  string user_id = 1;
}

message ListAvailableModelsResponse {
  repeated ModelChoice models = 1;
  bool openrouter_custom = 2;
}

// 一個可以選的模型。provider 是 "platform"（平台模型）或廠商名稱。
message ModelChoice {
  string provider = 1;
  string model = 2;
  // 能不能呼叫工具（會後處理需要）。
  bool supports_tools = 3;
}

message GetDefaultModelRequest {
  string user_id = 1;
}

message SetDefaultModelRequest {
  string user_id = 1;
  string provider = 2;
  string model = 3;
}

message ListProviderKeysRequest {
  string user_id = 1;
}

message ListProviderKeysResponse {
  repeated ProviderKey keys = 1;
}
