syntax = "proto3";

package transuai.transcription.v1;

import "google/protobuf/timestamp.proto";

// TranscriptionService 是純內部服務，供 Gateway / AI Service 查詢逐字稿，以及（經 Gateway）保存使用者對
// 逐字稿的編輯。跟 upload-service 的 InternalJobService 一樣不需要額外驗證身分，只信任內部網路呼叫——
// 「只能改自己的 job」由 Gateway 的 ownership 檢查把關。轉錄本身是 MQ 驅動（消費 transcription.requested）。
service TranscriptionService {
  rpc GetTranscript(GetTranscriptRequest) returns (Transcript);

  // 編輯一個片段的文字（見 transcription-service/CONTEXT.md「編輯」）。文字會先去掉前後空白，
  // 空字串＝清空這個片段（已清空片段）；還原＝把 original_text 送回來。文字跟目前相同時什麼都
  // 不做（revision 不變）；否則更新文字、revision +1、以未清空片段重組 full_text。片段的起訖時間
  // 永遠不變。job_id / segment_id 格式不對回 INVALID_ARGUMENT；job 沒有逐字稿、片段不存在或不屬於
  // 這個 job 回 NOT_FOUND；文字超過長度上限回 INVALID_ARGUMENT。同時編輯以最後寫入為準。
  rpc UpdateSegmentText(UpdateSegmentTextRequest) returns (UpdateSegmentTextResponse);

  // 替講者命名（見 transcription-service/CONTEXT.md「講者」），也是一次編輯。名稱會先去掉前後空白；空字串
  // 或等於預設名稱「講者 N」＝恢復預設名稱。顯示名稱跟目前相同時什麼都不做（revision 不變）；否則更新、
  // revision +1，並發送 transcript.edited。job_id 格式不對、名稱超過 100 字回 INVALID_ARGUMENT；job 沒有
  // 逐字稿或這個標籤的講者不存在回 NOT_FOUND。
  rpc RenameSpeaker(RenameSpeakerRequest) returns (RenameSpeakerResponse);

  // 把一個片段改成另一位講者，或新增一位講者給它（講者分離判斷錯時的修正），也是一次編輯。新講者排在顯示
  // 順序最後，可以附名稱（空字串＝預設名稱「講者 N」）。逐字稿還有沒講者的片段（講者分離之前的舊 Job）時，
  // 那些片段先一起歸給一位新的講者 1，這樣「只有一位講者」的逐字稿指定出第二位後就是兩位。片段已經是目標
  // 講者時什麼都不做（revision 不變）；否則更新、revision +1，並發送 transcript.edited。job_id / segment_id
  // 格式不對、沒有指定目標、名稱超過 100 字回 INVALID_ARGUMENT；job 沒有逐字稿、片段不存在或不屬於這個
  // job、這個標籤的講者不存在回 NOT_FOUND。
  rpc AssignSegmentSpeaker(AssignSegmentSpeakerRequest) returns (AssignSegmentSpeakerResponse);

  // 一個 Job 的轉錄用量（見 transcription-service/CONTEXT.md「轉錄用量」），依時間升冪；每次呼叫語音辨識服務一筆，
  // 失敗的也算。job_id 不合法回 INVALID_ARGUMENT；沒有紀錄回空列表。
  rpc ListJobTranscriptionUsage(ListJobTranscriptionUsageRequest) returns (ListJobTranscriptionUsageResponse);

  // 一位使用者在 [start, end) 之間的轉錄用量，依廠商、模型彙總（Gateway 把「某個月」換成這段時間）。
  // user_id 不合法、或沒給 start / end 回 INVALID_ARGUMENT；沒有用量回空列表。
  rpc SumUserTranscriptionUsage(SumUserTranscriptionUsageRequest) returns (SumUserTranscriptionUsageResponse);

  // 系統設定的「語音辨識」（只給管理員，權限由 gateway 檢查）：本地的語音辨識伺服器、Deepgram 的金鑰、講者分離的門檻。設定頁存過
  // 就是存的，沒存過就是環境變數；金鑰不回傳。存了馬上生效。存金鑰要有 KEY_ENCRYPTION_KEY（沒有就 FAILED_PRECONDITION）。
  rpc GetSpeechSettings(GetSpeechSettingsRequest) returns (SpeechSettings);
  rpc UpdateSpeechSettings(UpdateSpeechSettingsRequest) returns (SpeechSettings);
  // 用目前的設定試一下：本地伺服器有沒有這個模型；只有 Deepgram 時試它的金鑰。
  rpc CheckSpeechSettings(CheckSpeechSettingsRequest) returns (SpeechSettingsCheck);
}

message TranscriptSegment {
  double start_time = 1;
  double end_time = 2;
  // 說這個片段的講者，對應 Transcript.speakers 的 label；空字串＝沒有講者資訊（講者分離之前的舊 Job）。
  string speaker_label = 3;
  // 目前的文字；空字串代表已清空片段。
  string text = 4;
  string id = 5;
  // 人工編輯前的機器產出（原始文字），供還原使用。
  string original_text = 6;
}

message Transcript {
  string job_id = 1;
  string language = 2;
  string full_text = 3;
  repeated TranscriptSegment segments = 4;
  // 每次實際改動逐字稿（編輯）就 +1，從 0 開始。目的是讓 AI 產出（摘要/章節）記錄自己依據的版本，
  // 比對出是否過時。
  int32 revision = 5;
  // 這個 Job 的講者，依 display_order 排序；沒有講者資訊時是空的。不保證每位講者都還有片段。
  repeated Speaker speakers = 6;
}

// 講者分離找出的一位講者（見 transcription-service/CONTEXT.md「講者」）。
message Speaker {
  // 這個 Job 內的講者標籤（例如 "S1"），片段用它指向講者。
  string label = 1;
  // 要顯示的名稱，規則只在這裡決定：有自訂名稱就用自訂名稱，否則是「講者 N」（N＝display_order）。
  string display_name = 2;
  // 從 1 開始；講者分離找出的講者依第一次開口的順序編號。
  int32 display_order = 3;
}

message GetTranscriptRequest {
  string job_id = 1;
}

message UpdateSegmentTextRequest {
  string job_id = 1;
  string segment_id = 2;
  string text = 3;
}

message UpdateSegmentTextResponse {
  TranscriptSegment segment = 1;
  int32 revision = 2;
}

message RenameSpeakerRequest {
  string job_id = 1;
  string label = 2;
  string name = 3;
}

message RenameSpeakerResponse {
  Speaker speaker = 1;
  int32 revision = 2;
}

message AssignSegmentSpeakerRequest {
  string job_id = 1;
  string segment_id = 2;
  oneof target {
    // 改成這位現有的講者。
    string speaker_label = 3;
    // 新增一位講者給這個片段。
    NewSpeaker new_speaker = 4;
  }
}

message NewSpeaker {
  // 空字串＝預設名稱「講者 N」。
  string name = 1;
}

message AssignSegmentSpeakerResponse {
  TranscriptSegment segment = 1;
  // 這個 Job 所有的講者（可能多了新增的那位），依 display_order 排序。
  repeated Speaker speakers = 2;
  int32 revision = 3;
}

message ListJobTranscriptionUsageRequest {
  string job_id = 1;
}

message ListJobTranscriptionUsageResponse {
  repeated TranscriptionUsage records = 1;
}

message SumUserTranscriptionUsageRequest {
  string user_id = 1;
  google.protobuf.Timestamp start = 2;
  google.protobuf.Timestamp end = 3;
}

message SumUserTranscriptionUsageResponse {
  repeated TranscriptionUsageSum sums = 1;
}

// 同一個廠商、模型的轉錄用量加總。
message TranscriptionUsageSum {
  string provider = 1;
  string model = 2;
  // 已知秒數的加總；服務沒回報的不算進去（有幾次見 calls_with_unknown_usage）。
  double audio_seconds = 3;
  // 呼叫次數，失敗的也算。
  int32 calls = 4;
  // 服務沒有回報秒數的呼叫次數。
  int32 calls_with_unknown_usage = 5;
}

// 一次呼叫語音辨識服務的用量。
message TranscriptionUsage {
  string provider = 1;
  string model = 2;
  // 送進語音辨識服務的音檔秒數；服務沒有回報（例如呼叫失敗）時不設定（未知），不是 0。
  optional double audio_seconds = 3;
  bool succeeded = 4;
  google.protobuf.Timestamp created_at = 5;
}

message GetSpeechSettingsRequest {}

message SpeechSettings {
  string stt_base_url = 1;
  bool stt_api_key_set = 2;
  string stt_model = 3;
  bool deepgram_api_key_set = 4;
  double diarization_threshold = 5;
  // 用的是環境變數（設定頁沒存過）。
  bool from_environment = 6;
  // 這個服務裡有沒有講者分離的模型（本地辨識時用）。
  bool diarization_available = 7;
  // 目前轉錄用哪一個："local"、"deepgram" 或 "none"（都沒設定）。
  string active = 8;
}

message UpdateSpeechSettingsRequest {
  string stt_base_url = 1;
  string stt_model = 2;
  double diarization_threshold = 3;
  // 金鑰：沒帶就是不改，空字串就是清掉。
  optional string stt_api_key = 4;
  optional string deepgram_api_key = 5;
  // 刪掉存的設定，回到環境變數（其他欄位不看）。
  bool use_environment = 6;
}

message CheckSpeechSettingsRequest {}

message SpeechSettingsCheck {
  bool ok = 1;
  string detail = 2;
}
